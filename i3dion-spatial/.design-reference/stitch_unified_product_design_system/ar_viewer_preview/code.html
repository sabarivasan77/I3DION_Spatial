<style>
        /* Custom styles for the interactive toolbar buttons */
        .control-btn {
            @apply relative w-12 h-12 flex items-center justify-center rounded-xl text-on-surface-variant hover:bg-gray-100 transition-all active:scale-95;
        }
        .control-btn.active {
            @apply bg-primary-container text-white shadow-md;
        }
        .tooltip {
            @apply absolute -top-12 left-1/2 -translate-x-1/2 px-sm py-xs bg-inverse-surface text-inverse-on-surface text-[11px] rounded opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all whitespace-nowrap;
        }
        .tooltip::after {
            content: '';
            @apply absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-inverse-surface;
        }
    </style>
<script>
        // Micro-interactions for the UI
        function toggleHotspot() {
            const card = document.getElementById('hotspot-card');
            if (card.classList.contains('opacity-0')) {
                card.classList.remove('opacity-0', 'invisible', 'scale-95');
                card.classList.add('opacity-100', 'visible', 'scale-100');
            } else {
                card.classList.add('opacity-0', 'invisible', 'scale-95');
                card.classList.remove('opacity-100', 'visible', 'scale-100');
            }
        }

        let isLocked = false;
        function toggleLock() {
            isLocked = !isLocked;
            const icon = document.getElementById('lock-icon');
            const btn = document.getElementById('lock-btn');
            
            if (isLocked) {
                icon.innerText = 'lock';
                btn.classList.add('bg-warning/20', 'text-warning');
            } else {
                icon.innerText = 'lock_open';
                btn.classList.remove('bg-warning/20', 'text-warning');
            }
        }

        // Active state handling for transform controls
        const controlButtons = document.querySelectorAll('.control-btn[data-action]');
        controlButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                controlButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Simulation for "3D dragging" cursor change
        const viewport = document.querySelector('.ar-viewport');
        viewport.addEventListener('mousedown', () => {
            if(!isLocked) viewport.style.cursor = 'grabbing';
        });
        viewport.addEventListener('mouseup', () => {
            viewport.style.cursor = 'grab';
        });
    </script>
