<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

<main class="relative z-10 w-full max-w-[440px] px-margin">

<div class="w-14 h-14 bg-primary rounded-xl flex items-center justify-center mb-md shadow-lg shadow-primary/20">

<p class="font-caption text-caption text-on-surface-variant mt-xs">Enterprise AR Catalog &amp; Sales Visualization</p>
</div>
<!-- Login Card -->
<div class="bg-white rounded-xl border border-gray-200 login-card-shadow p-xl">
<header class="mb-lg">
<h2 class="font-h4 text-h4 text-on-surface">Welcome back</h2>
<p class="font-label text-label text-on-surface-variant">Please enter your details to sign in.</p>
</header>
<form class="space-y-lg" id="loginForm" onsubmit="return false">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label text-label text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="mail">mail</span>
<input class="w-full h-[48px] pl-xl pr-md bg-white border border-gray-200 rounded-xl font-body-reg text-body-reg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label text-label text-on-surface" for="password">Password</label>
<a class="font-label text-label text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="lock">lock</span>
<input class="w-full h-[48px] pl-xl pr-xl bg-white border border-gray-200 rounded-xl font-body-reg text-body-reg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-base">
<input class="w-5 h-5 rounded border-gray-200 text-primary focus:ring-primary cursor-pointer" id="remember" type="checkbox"/>
<label class="font-label text-label text-on-surface-variant cursor-pointer" for="remember">Remember for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] bg-primary text-on-primary font-label text-label rounded-xl hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-base shadow-lg shadow-primary/10" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- SSO Divider -->
<div class="relative flex items-center py-md">
<div class="flex-grow border-t border-gray-200"></div>
<span class="flex-shrink mx-md font-label text-label text-outline uppercase tracking-widest text-[10px]">Or continue with</span>
<div class="flex-grow border-t border-gray-200"></div>

<script>
        // Micro-interaction for form inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#004ac6';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#737686';
            });
        });

        // Simple visibility toggle for password
        const togglePass = document.querySelector('button[type="button"] .material-symbols-outlined[data-icon="visibility"]');
        const passInput = document.getElementById('password');
        if (togglePass) {
            togglePass.parentElement.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                togglePass.textContent = isPass ? 'visibility_off' : 'visibility';
            });
        }
    </script>
