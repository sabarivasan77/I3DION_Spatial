<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#bg)"/>
  <rect width="600" height="450" fill="url(#grid)"/>
  <rect x="20" y="20" width="560" height="410" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Technical Reticle & CAD Axis -->
  <circle cx="300" cy="200" r="100" stroke="rgba(56,189,248,0.15)" stroke-width="1" stroke-dasharray="6 6"/>
  <circle cx="300" cy="200" r="60" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>
  <path d="M 170 200 H 430 M 300 70 V 330" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Central Isometric 3D Mesh Wireframe Symbol -->
  <g transform="translate(300, 200)">
    <!-- Top Face -->
    <path d="M 0 -50 L 58 -20 L 0 10 L -58 -20 Z" fill="rgba(56,189,248,0.2)" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Right Face -->
    <path d="M 0 10 L 58 -20 L 58 45 L 0 75 Z" fill="rgba(14,165,233,0.35)" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Left Face -->
    <path d="M -58 -20 L 0 10 L 0 75 L -58 45 Z" fill="rgba(2,132,199,0.5)" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Interior Pivot Node -->
    <circle cx="0" cy="10" r="6" fill="#F8FAFC"/>
  </g>

  <!-- Badges Top Row -->
  <g transform="translate(40, 48)">
    <!-- Demo Model Tag -->
    <rect width="170" height="26" rx="6" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)" stroke-width="1"/>
    <text x="85" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="0.5">DEMONSTRATION MODEL</text>

    <!-- License Tag -->
    <rect x="180" width="90" height="26" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
    <text x="225" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">CC0-1.0</text>
  </g>

  <!-- Title & Metadata Bottom -->
  <g transform="translate(40, 365)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Toy Car</text>
    <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Attribution: Guido Odendahl</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="0.5">I3DION SPATIAL HUB • 3D SHOWCASE</text>
  </g>
</svg>