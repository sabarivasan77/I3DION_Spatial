<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="I3DION Spatial industrial AR catalog and sales visualization platform"
    />
    <title>I3DION Spatial</title>
    <!-- Google model-viewer: enables AR on Android (Scene Viewer), iOS (Quick Look), and WebXR -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <script type="module" crossorigin src="/assets/index-lE1kSggR.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C7z4uwLJ.css">
  </head>
  <body>
    <div id="root">
      <div
        id="vite-fallback"
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px;
          font-family: Inter, Segoe UI, Arial, sans-serif;
          color: #0f172a;
          background: #f8fafc;
        "
      >
        <div
          style="
            max-width: 560px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #ffffff;
            padding: 32px;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
          "
        >
          <h1 style="margin: 0 0 12px; font-size: 28px">I3DION Spatial</h1>
          <p style="margin: 0 0 16px; line-height: 1.6; color: #64748b">
            This React/Vite app must be launched through the Vite dev server. Opening
            <strong>index.html</strong> directly from the filesystem will show a blank page because
            the browser cannot compile TypeScript/TSX modules.
          </p>
          <pre
            style="
              margin: 0;
              overflow: auto;
              border-radius: 12px;
              background: #0f172a;
              padding: 16px;
              color: #dbeafe;
              font-size: 14px;
            "
          ><code>npm install
npm run dev</code></pre>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:red;color:white;padding:20px;z-index:9999;white-space:pre-wrap;overflow:auto;">' + 
          '<h1>Frontend Runtime Error</h1>' +
          '<p>' + event.message + '</p>' + 
          '<p>In ' + event.filename + ':' + event.lineno + '</p>' + 
          '<pre>' + (event.error && event.error.stack ? event.error.stack : '') + '</pre>' +
          '</div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:darkred;color:white;padding:20px;z-index:9999;white-space:pre-wrap;overflow:auto;">' + 
          '<h1>Unhandled Promise Rejection</h1>' +
          '<p>' + event.reason + '</p>' + 
          '<pre>' + (event.reason && event.reason.stack ? event.reason.stack : '') + '</pre>' +
          '</div>';
      });
    </script>
  </body>
</html>
