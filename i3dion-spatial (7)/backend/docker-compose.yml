version: '3.8'

services:
  # Database Layer
  postgres:
    image: postgres:15-alpine
    container_name: i3dion-postgres
    restart: always
    environment:
      POSTGRES_USER: i3dion_perf
      POSTGRES_PASSWORD: enterprise_secure_pass_2026
      POSTGRES_DB: i3dion_spatial_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U i3dion_perf -d i3dion_spatial_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # caching and message Queue Layer
  redis:
    image: redis:7-alpine
    container_name: i3dion-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3 Object Storage Layer for CAD models, glb Files, and QR code distributions
  minio:
    image: minio/minio:latest
    container_name: i3dion-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: i3dion_admin
      MINIO_ROOT_PASSWORD: minio_enterprise_security_pass
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # NestJS Core Application microservice
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: i3dion-nestjs-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://i3dion_perf:enterprise_secure_pass_2026@postgres:5432/i3dion_spatial_db?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: i3dion_admin
      MINIO_SECRET_KEY: minio_enterprise_security_pass
      MINIO_USE_SSL: "false"
      JWT_SECRET: enterprise_jwt_secret_token_rotation_key_2026_spatial
      JWT_EXPIRATION: "1d"
      IMAGE_OPTIMIZATION_ENABLED: "true"
      MODEL_PIPELINE_VALIDATION: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Reverse Proxy & Edge Gateway for SSL and serving assets
  nginx:
    image: nginx:alpine
    container_name: i3dion-nginx-router
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
