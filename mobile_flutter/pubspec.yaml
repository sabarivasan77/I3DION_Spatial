name: i3dion_spatial_hub_mobile
description: "Cross-platform I3DION Spatial Hub mobile app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  app_links: ^7.2.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  model_viewer_plus: ^1.10.0
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
